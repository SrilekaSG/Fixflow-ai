services:
  db:
    image: postgres:16-alpine
    container_name: fixflow-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fixflow}
      POSTGRES_USER: ${POSTGRES_USER:-fixflow_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_locally}
    ports:
      - "5433:5432"
    volumes:
      - fixflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./Fixflow-backend
    container_name: fixflow-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-fixflow}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-fixflow_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-change_me_locally}
      AI_PROVIDER: ${AI_PROVIDER:-disabled}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-30}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-1500}
      APP_MAX_UPLOAD_MB: ${APP_MAX_UPLOAD_MB:-1}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - "8080:8080"

  frontend:
    build: ./Fixflow-frontend
    container_name: fixflow-frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  fixflow_pgdata:
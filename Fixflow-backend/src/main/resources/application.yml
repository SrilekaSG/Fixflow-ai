
spring:
  application:
    name: fixflow-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/fixflow}
    username: ${SPRING_DATASOURCE_USERNAME:fixflow_user}
    password: ${SPRING_DATASOURCE_PASSWORD:change_me_locally}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration
    placeholder-replacement: false

  servlet:
    multipart:
      max-file-size: ${APP_MAX_UPLOAD_MB:1}MB
      max-request-size: ${APP_MAX_UPLOAD_MB:1}MB

server:
  port: ${SERVER_PORT:8081}
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  max-upload-mb: ${APP_MAX_UPLOAD_MB:1}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

ai:
  provider: ${AI_PROVIDER:disabled}
  api-key: ${AI_API_KEY:}
  base-url: ${AI_BASE_URL:}
  model: ${AI_MODEL:}
  timeout: ${AI_TIMEOUT_SECONDS:30}s
  max-output-tokens: ${AI_MAX_OUTPUT_TOKENS:1500}
